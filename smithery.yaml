# Smithery configuration: https://smithery.ai/docs
# Verdex is read-only and text-only; this command only starts the stdio server.
# Deployed from the GitHub repository (no npm package required): Smithery
# installs the Node dependencies, then runs the same source entry point.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    required: []
  commandFunction: |-
    (config) => ({ command: 'node', args: ['src/cli.js', 'mcp'] })
