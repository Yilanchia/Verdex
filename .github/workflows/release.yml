name: Release

# MANUAL ONLY for now.
#
# Publishing to npm currently requires the maintainer's npm account to have 2FA
# enabled: npm rejects publishes from accounts/tokens without it with
# "Two-factor authentication or granular access token with bypass 2fa enabled is
# required". Until 2FA is enabled and an NPM_TOKEN secret exists, this workflow is
# manual-only so that pushing a version tag cannot produce a red CI run.
#
# To re-enable releases: enable 2FA on npm, add NPM_TOKEN to the repository
# secrets, then restore the tag trigger below:
#   push:
#     tags: ["v*"]
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publish verdex (CLI + library + tools)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish verdex-mcp (stdio entry)
        working-directory: packages/verdex-mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
